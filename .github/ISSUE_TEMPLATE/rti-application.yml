name: New RTI Application
description: File a new Right to Information request
title: "[RTI]: "
labels: ["02 Filed"]
body:
  - type: input
    id: rti_id
    attributes:
      label: RTI Registration ID
      placeholder: e.g. RTI/2026/001
    validations:
      required: false

  - type: textarea
    id: info_requested
    attributes:
      label: Information Requested
      description: What specific documents or answers are you seeking?
      placeholder: 1. Copy of the attendance register...
    validations:
      required: true

  - type: input
    id: filing_date
    attributes:
      label: Date of Filing
      placeholder: DD-MM-YYYY
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode of Filing
      options:
        - Online (RTI Portal)
        - Offline (Direct Submission)
        - Speed Post
    validations:
      required: true

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      options:
        - Central Government
        - Andhra Pradesh
        - Arunachal Pradesh
        - Assam
        - Bihar
        - Chandigarh
        - Chhattisgarh
        - Dadra and Nagar Haveli
        - Daman and Diu
        - Delhi
        - Goa
        - Gujarat
        - Haryana
        - Himachal Pradesh
        - Jammu and Kashmir
        - Jharkhand
        - Karnataka
        - Kerala
        - Ladakh
        - Lakshadweep
        - Madhya Pradesh
        - Maharashtra
        - Manipur
        - Meghalaya
        - Mizoram
        - Nagaland
        - Odisha
        - Puducherry
        - Punjab
        - Rajasthan
        - Sikkim
        - Tamil Nadu
        - Telangana
        - Tripura
        - Uttar Pradesh
        - Uttarakhand
        - West Bengal
        - Andaman and Nicobar Islands
    validations:
      required: true

  - type: input
    id: district
    attributes:
      label: District
      placeholder: e.g. Thrissur
    validations:
      required: false

  - type: input
    id: office
    attributes:
      label: Public Authority / Office
      placeholder: e.g. Dept of Revenue
    validations:
      required: true

  - type: textarea
    id: pio_contact
    attributes:
      label: PIO Contact Info
      description: Name, Email, and Phone Number.
      placeholder: "Name: Mr. Suresh Kumar\nPhone: +91 98765 43210"
    validations:
      required: false

  - type: input
    id: total_expense
    attributes:
      label: Total Expense (INR)
      placeholder: e.g. 10
    validations:
      required: false
