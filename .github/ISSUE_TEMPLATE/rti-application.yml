name: New RTI Application
description: Track an RTI application
labels: ["02 Filed"]
body:
  - type: input
    id: rti_id
    attributes:
      label: RTI Registration ID
      placeholder: e.g. RTI/2026/001 (Leave blank if pending)
    validations:
      required: false

  - type: textarea
    id: info_requested
    attributes:
      label: Information Requested
      description: Briefly list the questions or documents you are asking for.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode of Filing
      options:
        - Online (RTI Portal)
        - Offline (Direct Submission)
        - Speed Post
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <br>
        ---
        ### 📅 Timeline

  - type: input
    id: filing_date
    attributes:
      label: Date of Filing
      placeholder: DD-MM-YYYY (e.g. 21-02-2026)
    validations:
      required: true

  - type: input
    id: due_date
    attributes:
      label: Deadline for Reply (30 Days)
      description: Calculated as Date of Filing + 30 Days.
      placeholder: DD-MM-YYYY (e.g. 23-03-2026)
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <br>
        ---
        ### 📍 Jurisdiction & Office

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      options:
        - Central Government
        - Kerala
        - Andhra Pradesh
        - Arunachal Pradesh
        - Assam
        - Bihar
        - Chandigarh
        - Chhattisgarh
        - Dadra and Nagar Haveli
        - Daman and Diu
        - Delhi
        - Goa
        - Gujarat
        - Haryana
        - Himachal Pradesh
        - Jammu and Kashmir
        - Jharkhand
        - Karnataka
        - Ladakh
        - Lakshadweep
        - Madhya Pradesh
        - Maharashtra
        - Manipur
        - Meghalaya
        - Mizoram
        - Nagaland
        - Odisha
        - Puducherry
        - Punjab
        - Rajasthan
        - Sikkim
        - Tamil Nadu
        - Telangana
        - Tripura
        - Uttar Pradesh
        - Uttarakhand
        - West Bengal
        - Andaman and Nicobar Islands
    validations:
      required: true

  - type: input
    id: district
    attributes:
      label: District
      placeholder: e.g. Thrissur
    validations:
      required: false

  - type: input
    id: office
    attributes:
      label: Public Authority / Office
      placeholder: e.g. Dept of Revenue, Municipal Corporation
    validations:
      required: true

  - type: textarea
    id: pio_contact
    attributes:
      label: PIO Contact Info
      description: Name, designation, email, and phone number of the PIO.
      placeholder: |
        Name: Mrs. Jane Doe (Assistant Engineer)
        Phone: +91 9876543210
        Email: pio@dept.gov.in
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        <br>
        ---

  - type: input
    id: total_expense
    attributes:
      label: Total Expense (₹)
      description: Includes Application Fee, IPO, Court Stamps, and Postage.
      placeholder: e.g. 10
    validations:
      required: false
