name: New RTI Application
description: File a new Right to Information request
title: "[RTI]: "
labels: ["02 Filed"]
body:
  - type: markdown
    attributes:
      value: |
        ## 📝 RTI Application Form
        Please fill in the details below to track a new Right to Information request.

  - type: input
    id: rti_id
    attributes:
      label: RTI Registration ID
      placeholder: e.g., RTI/2026/001 (Leave blank if not yet assigned)
    validations:
      required: false

  - type: textarea
    id: info_requested
    attributes:
      label: Information Requested
      description: What specific documents or answers are you seeking?
      placeholder: |
        1. Copy of the attendance register...
        2. Details of funds allocated...
    validations:
      required: true

  - type: markdown
    attributes:
      value: "---"

  - type: input
    id: date_filed
    attributes:
      label: Date of Filing
      placeholder: DD-MM-YYYY
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode of Filing
      options:
        - Online (RTI Portal)
        - Offline (Direct Submission)
        - Speed Post
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### 📍 Jurisdiction & Office"

  - type: dropdown
    id: jurisdiction
    attributes:
      label: Jurisdiction
      options:
        - Central Government
        - Andhra Pradesh
        - Arunachal Pradesh
        - Assam
        - Bihar
        - Chandigarh
        - Chhattisgarh
        - Dadra and Nagar Haveli and Daman and Diu
        - Delhi
        - Goa
        - Gujarat
        - Haryana
        - Himachal Pradesh
        - Jammu and Kashmir
        - Jharkhand
        - Karnataka
        - Kerala
        - Ladakh
        - Lakshadweep
        - Madhya Pradesh
        - Maharashtra
        - Manipur
        - Meghalaya
        - Mizoram
        - Nagaland
        - Odisha
        - Puducherry
        - Punjab
        - Rajasthan
        - Sikkim
        - Tamil Nadu
        - Telangana
        - Tripura
        - Uttar Pradesh
        - Uttarakhand
        - West Bengal
        - Andaman and Nicobar Islands
    validations:
      required: true

  - type
